[project]
name = "totalhelp"
version = "0.1.1"
authors = [
    { name = "Matthew Dean Martin", email = "matthewdeanmartin@gmail.com" },
]
description = "Print help for all commands and subcommands for argparse applications"
readme = "README.md"
requires-python = ">=3.11"
# Pin license files explicitly so the build never falls back to hatchling's
# default glob, which walks non-gitignored dirs and sweeps up dependency LICENSEs.
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "rich>=10.0.0",
    "rich-argparse>=1.0.0",
]

[project.optional-dependencies]
rich = [
]

[project.urls]
"Homepage" = "https://github.com/matthewdeanmartin/totalhelp"
"Bug Tracker" = "https://github.com/matthewdeanmartin/totalhelp/issues"


[dependency-groups]
dev = [
    "jiggle-version>=2.1.0",
    # The [all] extra pulls google-re2, which has no cp315 wheel and fails to
    # build on Windows (missing absl headers). The base package is pure Python
    # and still provides the `kaclm` CLI this repo actually uses.
    "keepachangelog-manager-fork[fast]>=6.8.0; python_version < '3.15'",
    "keepachangelog-manager-fork[stdlib]>=6.8.0; python_version >= '3.15'",
    "troml-dev-status>=0.6.0",
    "dont-be-lazy>=0.1.2",
    "pydoc-fork>=3.0.0",

    # "troml",
    "bitrab",
    "cli-tool-audit",
    "git2md",
    "pyclean; python_version >= '3.12'",
    "strip-docs>=1.0; python_version >= '3.12'",
    "gha-update; python_version >= '3.12'",
    "mkdocstrings[python]",
    "mkdocs; python_version >= '3.12'",
    "mdformat",
    # plugin finder
    "packaging",
    # mpy
    "mypy",
    # "types-toml",
    # reports

    # build
    "vermin",
    "metametameta>=0.1.14",
    "hatchling",
    "ruff>=0.12.0",
    "pylint",
    "bandit",
    "pre-commit",
    # testing tools
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-sugar>=0.9.7",
    "pytest-mock",
    "pytest-unused-fixtures",
    "hypothesis[cli]",
    "detect-test-pollution",
    "pytest-timeout>=2.4.0",
    # docs
    "interrogate>=1.5.0",
    "pydoctest==0.2.1",
    "pdoc3>=0.5.0",
    "mdformat>=0.5.0",
    "linkcheckmd>=1.4.0",
    "codespell>=2.2.6",
    "pyenchant>=3.2.2",
]


[project.scripts]
totalhelp = "totalhelp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "totalhelp/**/*.py",
    "totalhelp/py.typed",
    "/README.md", "/LICENSE",
]

exclude = [
]

[tool.hatch.build.targets.wheel]
packages = ["totalhelp"]
include = [
    "totalhelp/**/*.py",
    "totalhelp/py.typed",
    "/README.md", "/LICENSE",
]
[tool.uv]

[tool.uv.pip]

# changelogmanager (keepachangelog-manager-fork) drives the release workflows.
# See .github/workflows/create_draft_release.yml and release.yml.
[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
enforce_preamble = true
format = "auto"

[tool.changelogmanager.defaults]
skip_ci = true
error_format = "github"
commit_schema = "keepachangelog"
schema_version = "current"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"
universal = true

[tool.ruff.lint]
ignore = ["RUF100", "BLE001", "PIE810", "PLW1510", "SIM103"]  # unused noqa differs across Python versions
